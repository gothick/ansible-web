[Definition]
# fail2ban strips the *detected date substring* out of each line before
# running failregex against it (necessary for logs like Apache's combined
# format, where the timestamp sits mid-line rather than at the start) - but
# it only removes the date text, not the brackets around it, so a real log
# line like:
#   1.2.3.4 - - [06/Sep/2026:08:22:00 +0000] "GET /x HTTP/1.1" 404 ...
# is actually searched as:
#   1.2.3.4 - - [] "GET /x HTTP/1.1" 404 ...
# The original version of this filter required "\[[^\]]+\]" (one or more
# characters inside the brackets), which can never match the now-empty "[]"
# - so it matched precisely nothing, in production, since it was written.
# Fixed by not trying to parse the timestamp field at all and using ".*" to
# skip over it, same as every stock fail2ban Apache filter does.
failregex = ^<HOST> -.*"(?:GET|HEAD|POST|PUT|DELETE|OPTIONS|PROPFIND|PATCH) \S+ HTTP/\d\.\d" 404
            ^<HOST> -.*"-" 40[08]
ignoreregex =
