---
# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible/ansible-lint/main/src/ansiblelint/schemas/vars.json

# Configure fail2ban defaults

fail2ban_ignoreips:
  - 127.0.0.1/8
  - 172.31.16.0/20 # AWS VPC range
  # Me
  - "{{ admin_ip_address }}"
  # Jetpack
  - 122.248.245.244/32
  - 54.217.201.243/32
  - 54.232.116.4/32
  - 192.0.80.0/20
  - 192.0.96.0/20
  - 192.0.112.0/20
  - 195.234.108.0/22
  - 192.0.64.0/18

fail2ban_filterd_path: "{{ playbook_dir }}/files/filter.d/"

fail2ban_services:
  - name: sshd
  - name: apache-auth
    logpath: /var/log/apache2/*error.log
  - name: apache-overflows
    logpath: /var/log/apache2/*error.log
  - name: apache-badbots
    logpath: /var/log/apache2/*access.log
  - name: apache-noscript
    logpath: /var/log/apache2/*error.log
  - name: apache-nohome
    logpath: /var/log/apache2/*error.log
  - name: apache-botsearch
    logpath: /var/log/apache2/*error.log
  - name: apache-fakegooglebot
    logpath: /var/log/apache2/*access.log
  - name: apache-shellshock
    logpath: /var/log/apache2/*error.log
  - name: php-url-fopen
    logpath: /var/log/apache2/*access.log
  - name: apache-wordpress-logins
    port: https
    filter: apache-wordpress-logins
    logpath: /var/log/apache2/gothick.org.uk-https-access.log
    maxretry: 2
    findtime: 600
    bantime: 3600
  - name: apache-wordpress-author-exclude
    port: https
    filter: apache-wordpress-author-exclude
    logpath: /var/log/apache2/gothick.org.uk-https-access.log
    maxretry: 2
    findtime: 600
    bantime: 3600
  - name: apache-404flood
    filter: apache-404flood
    port: http,https
    logpath: /var/log/apache2/*access.log
    maxretry: 20
    findtime: 30
    bantime: 3600
